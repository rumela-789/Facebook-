# Run this ONCE. It creates your app signing key. Keep it forever: without it you cannot update the app.
name: 1 - Make signing key
on: workflow_dispatch
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Create keystore
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then echo "Add the secret KEYSTORE_PASSWORD first (Settings > Secrets and variables > Actions)"; exit 1; fi
          keytool -genkeypair -v -keystore android.keystore -alias vimline -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Vimline, O=Vimline, C=BD"
          base64 -w 0 android.keystore > keystore-base64.txt
          keytool -list -v -keystore android.keystore -storepass "$KS_PASS" | grep -E "SHA256|SHA-256" || true
      - uses: actions/upload-artifact@v4
        with:
          name: vimline-signing-key
          path: |
            android.keystore
            keystore-base64.txt
          retention-days: 1
