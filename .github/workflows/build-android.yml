name: 2 - Build Android app (APK + AAB)
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli
      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "Add the secret KEYSTORE_BASE64 first (run workflow 1)"; exit 1; fi
          echo "$KS_B64" | base64 -d > android.keystore
      - name: Generate and build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json < /dev/null || true
          bubblewrap build --skipPwaValidation < /dev/null
      - name: Show signing fingerprint (put this in assetlinks.json)
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: keytool -list -v -keystore android.keystore -storepass "$KS_PASS" | grep -E "SHA256|SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: vimline-android
          path: |
            *.apk
            *.aab
          retention-days: 14
