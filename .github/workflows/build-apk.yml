name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          rm -rf www && mkdir www
          cp index.html manifest.json sw.js privacy.html www/ 2>/dev/null || true
          cp icon-512.png www/

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Use fixed debug keystore
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Set app icon
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            mkdir -p $RES/mipmap-$d
            convert icon-512.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher.png
            convert icon-512.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher_round.png
            convert icon-512.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher_foreground.png
          done

      - name: Set splash screen (no stretch)
        run: |
          RES=android/app/src/main/res
          convert splash.png -resize 800x800 -background "#000000" -gravity center -extent 1080x2400 /tmp/splash.png
          find $RES -name "splash.png" -exec cp /tmp/splash.png {} \;
          mkdir -p $RES/drawable
          cp /tmp/splash.png $RES/drawable/splash.png

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Show APK SHA-1
        run: keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA1|SHA256"

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
