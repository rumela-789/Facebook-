name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create placeholder web folder
        run: |
          mkdir -p www
          echo '<!doctype html><html><body></body></html>' > www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Copy icon
        run: |
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp icon-192.png android/app/src/main/res/$d/ic_launcher.png
            cp icon-192.png android/app/src/main/res/$d/ic_launcher_round.png
            cp icon-192.png android/app/src/main/res/$d/ic_launcher_foreground.png
          done

      - name: Remove splash screen
        run: |
          sed -i 's/AppTheme.NoActionBarLaunch/AppTheme.NoActionBar/g' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: vimline-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
