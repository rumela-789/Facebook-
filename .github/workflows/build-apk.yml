name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create placeholder web folder
        run: |
          mkdir -p www
          echo '<!doctype html><html><body></body></html>' > www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Copy icon
        run: |
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp icon-192.png android/app/src/main/res/$d/ic_launcher.png
            cp icon-192.png android/app/src/main/res/$d/ic_launcher_round.png
            cp icon-192.png android/app/src/main/res/$d/ic_launcher_foreground.png
          done

      - name: Create splash screen
        run: |
          pip install pillow
          python3 - << 'PYEOF'
          import glob
          from PIL import Image
          logo = Image.open("icon-512.png").convert("RGBA")
          for f in glob.glob("android/app/src/main/res/**/splash.png", recursive=True):
              w, h = Image.open(f).size
              bg = Image.new("RGBA", (w, h), "#0d1117")
              size = int(min(w, h) * 0.3)
              l = logo.resize((size, size))
              bg.paste(l, ((w - size) // 2, (h - size) // 2), l)
              bg.convert("RGB").save(f)
              print("updated", f)
          PYEOF

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: vimline-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
