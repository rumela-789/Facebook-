<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vimline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#0A0A0A;--ink:#E6E6E6;--mut:#8E9694;--line:#222;--acc:#1F7A6E;--on:#F0FAF8;--at:#5FD3C2;--gold:#E8C170;--chip:#161616;--ok:#12302B;--okt:#9BE6D8;--warn:#A33B2B;--like:#F0506E;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root[data-theme=light]{--bg:#EEF2F1;--card:#F8FAF9;--ink:#1A2222;--mut:#55625F;--line:#CBD5D2;--acc:#0F766E;--on:#F0FDFA;--at:#0F766E;--gold:#9A6B12;--chip:#DCE5E2;--ok:#D2EBE5;--okt:#0B4F48;--warn:#A33B2B;--like:#D6264A;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
.w{max-width:560px;margin:0 auto;padding:0 12px calc(84px + env(safe-area-inset-bottom,0px))}
header{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:8px 2px 4px;gap:8px}
.logo{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:24px;line-height:1.25;letter-spacing:.34em;text-indent:.34em;text-transform:uppercase;text-align:center;background:linear-gradient(100deg,var(--at) 10%,var(--gold) 90%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.sub{font-size:13px;color:var(--mut)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--bg);border-top:1px solid var(--line);padding:4px max(0px,calc((100% - 560px)/2)) calc(4px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;border:0;background:transparent;color:var(--mut);min-height:52px;position:relative;display:flex;align-items:center;justify-content:center}
.tabs button.on{color:var(--at)}.tabs button.on svg{stroke-width:2.2;fill:currentColor;fill-opacity:.14}
.tabs button.on::after{content:"";position:absolute;bottom:2px;left:50%;width:18px;height:3px;margin-left:-9px;border-radius:3px;background:linear-gradient(100deg,#2BD3AC,#E6C27A)}
.tabs button svg{width:30px;height:30px}
.bdg{position:absolute;top:4px;left:calc(50% + 6px);background:var(--warn);color:var(--on);font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;padding:0 4px;display:flex;align-items:center;justify-content:center}.bdg[hidden]{display:none}
.tabs button.avatar-tab{padding:0}
.tabs button.avatar-tab img,.tabs button.avatar-tab .dot-av{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid transparent}
.tabs button.avatar-tab .dot-av{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;background:#333}
.tabs button.avatar-tab.on img,.tabs button.avatar-tab.on .dot-av{border-color:var(--at)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 28px -12px rgba(0,0,0,.6)}
.row{display:flex;gap:10px;align-items:center}
.wr{flex-wrap:wrap}
.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;object-fit:cover}
.av.l{width:84px;height:84px;font-size:32px}
.nm{font-weight:700;overflow-wrap:anywhere}
.tx{margin:8px 0 2px;font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer}
input,select,textarea{width:100%;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-height:44px;margin-top:8px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#2BD3AC;box-shadow:0 0 0 3px rgba(43,211,172,.14)}
textarea{resize:none}
::placeholder{color:var(--mut);opacity:.85}
.b{border:0;border-radius:12px;min-height:44px;padding:0 16px;font-weight:600;background:var(--acc);color:var(--on)}
.b:disabled{opacity:.5}
.act{display:flex;flex-wrap:wrap;gap:2px;border-top:1px solid var(--line);margin-top:8px;padding-top:4px}
.act button{border:0;background:transparent;color:var(--mut);font-weight:700;min-height:44px;padding:0 12px;border-radius:10px}
.act button.on{color:var(--at)}.act button.lk.on{color:var(--like)}.act .rt{margin-left:auto}
.cm{background:var(--chip);border-radius:12px;padding:8px 12px;margin-top:8px;font-size:15px;overflow-wrap:anywhere}
.ci{display:flex;gap:6px;margin-top:10px}.ci input{margin:0;border-radius:999px}
.ch{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}.ch::-webkit-scrollbar{display:none}
.ch button{flex-shrink:0;border:1.5px solid var(--line);border-radius:999px;min-height:40px;padding:0 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--chip);border:1px solid var(--line)}
.tag.ok{background:var(--ok);color:var(--okt);border-color:transparent}.tag.u{background:var(--warn);color:var(--on)}
.note{text-align:center;color:var(--mut);padding:36px 12px}
a{color:var(--at);font-weight:700}
img.ph{width:100%;border-radius:12px;margin-top:8px;display:block}
.me{background:linear-gradient(135deg,#22B79A,#0F766E);color:#F2FBF9;margin-left:auto;border-radius:14px 14px 2px 14px}
.ot{background:var(--chip);border-radius:14px 14px 14px 2px}
.bub{max-width:80%;padding:9px 14px;margin-top:6px;overflow-wrap:anywhere;line-height:1.4}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--at)}
#msg{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:3;background:var(--acc);color:var(--on);border-radius:14px;padding:8px 12px;margin-top:6px;font-size:14px}
.mb{width:44px;height:44px;border:0;border-radius:14px;background:var(--chip);font-size:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--ink);border:1px solid var(--line)}
.mb:active{transform:scale(.93)}
#dr{position:fixed;inset:0;z-index:10;display:flex}#dr[hidden]{display:none}
.dp{width:min(320px,86vw);background:var(--card);height:100%;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));border-right:1px solid var(--line)}
.ds{flex:1;background:rgba(0,0,0,.55)}
.mi{display:flex;align-items:center;width:100%;min-height:48px;border:0;background:transparent;text-align:left;padding:0 8px;border-radius:10px;font-weight:600;font-size:16px;gap:10px}
.mi:active{background:var(--chip)}
.ti{font-size:12px;color:var(--mut)}
#cl{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center}#cl[hidden]{display:none}
#rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#lv{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:96px;height:132px;object-fit:cover;border-radius:12px;border:1.5px solid var(--line);background:#111;transform:scaleX(-1);z-index:1}
#cinfo{position:relative;z-index:1;text-align:center;padding:0 16px;background:rgba(0,0,0,.45);border-radius:14px;padding:14px}
#cbtn{position:absolute;left:0;right:0;bottom:calc(32px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:20px;z-index:2}
.cb{width:62px;height:62px;border-radius:50%;border:0;background:var(--chip);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:22px}
.cb.end{background:var(--warn);color:#fff}
.ad{display:inline-flex;align-items:center;justify-content:center;gap:3px;border-radius:999px;min-height:32px;padding:0 12px;font-size:13px;font-weight:700;white-space:nowrap;flex-shrink:0}
.mention{color:#2BD3AC;background:rgba(43,211,172,.12);padding:1px 5px;border-radius:5px;font-weight:700;cursor:pointer}
.hashtag{color:var(--gold);background:rgba(230,194,122,.14);padding:1px 5px;border-radius:5px;font-weight:700;cursor:pointer}
.cap{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;white-space:pre-wrap;overflow-wrap:anywhere}
.cap.img-cap{-webkit-line-clamp:3}.cap.text-cap{-webkit-line-clamp:7}
.cap.expanded{-webkit-line-clamp:unset;display:block;cursor:default}
.see-more{color:var(--at);font-weight:700;font-size:13px;cursor:pointer;display:inline-block;padding:2px 0;margin-top:2px}
.see-more[hidden]{display:none}
.react-bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rp{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--mut);font-size:13px;font-weight:700;border:1px solid var(--line);min-height:30px;cursor:pointer;transition:transform .15s;user-select:none;-webkit-user-select:none}
.rp:active{transform:scale(.94)}
.rp.active{background:var(--line);border-color:var(--mut);color:var(--ink)}
.rp .e{font-size:15px;filter:grayscale(1)}
.rpick{display:flex;gap:2px;align-items:center;margin-top:6px;padding:4px 8px;border-radius:999px;background:var(--chip);border:1px solid var(--line);width:max-content;max-width:100%}
.rpick button{width:38px;height:38px;border-radius:50%;border:0;background:transparent;font-size:22px;filter:grayscale(1);padding:0}
.rpick button.active{background:var(--line)}
.rpick .x2{font-size:14px;color:var(--mut);filter:none;width:auto;height:auto}
.search-wrap{position:relative;margin-top:10px}
.sbx{position:relative;margin-top:10px;display:flex;align-items:center}
.sbx>span{position:absolute;left:15px;color:var(--mut);pointer-events:none}
.sbx input{margin:0;height:48px;border-radius:999px;padding:0 42px 0 44px;background:var(--card)}
.sbx .x{position:absolute;right:6px;width:36px;height:36px;border:0;background:transparent;color:var(--mut);border-radius:50%;font-size:15px}
.link{background:none;border:0;color:var(--at);font-weight:600;padding:8px 6px;min-height:44px}
.flag-banner{background:linear-gradient(135deg,#7F1D1D,#991B1B);color:#fff;padding:12px;border-radius:12px;margin-top:8px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.flag-banner button{align-self:flex-start;background:#2A1210;color:#FF9C8F;border:1px solid #5A2320;border-radius:8px;padding:6px 12px;font-weight:700}
.prof-stats{display:flex;margin-top:14px;justify-content:space-around;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0}
.prof-stats button{flex:1;background:transparent;border:0;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px}
.prof-stats button b{font-size:18px}
.prof-stats button span{font-size:12px;color:var(--mut)}
.inner-tabs{display:flex;margin-top:14px;border-bottom:1px solid var(--line)}
.inner-tabs button{flex:1;background:transparent;border:0;color:var(--mut);min-height:44px;font-weight:700;position:relative}
.inner-tabs button.on{color:#2BD3AC}
.inner-tabs button.on::after{content:"";position:absolute;bottom:-1px;left:20%;right:20%;height:2px;background:linear-gradient(100deg,#2BD3AC,#E6C27A);border-radius:2px 2px 0 0}
.mdd{position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-height:240px;overflow-y:auto;margin-top:2px;padding:4px}
.mdd[hidden]{display:none}
.mdd-it{display:flex;gap:10px;align-items:center;width:100%;min-height:48px;border:0;background:transparent;text-align:left;padding:6px 10px;border-radius:8px;color:var(--ink);cursor:pointer}
.mdd-it:hover,.mdd-it.act{background:var(--chip);outline:none}
.grp-sender{font-size:12px;font-weight:700;color:#2BD3AC;margin:6px 0 0 34px}
.sysmsg{text-align:center;color:var(--mut);font-size:12px;padding:6px;font-style:italic}
#lg{position:fixed;inset:0;z-index:40;overflow:auto;background:radial-gradient(120% 55% at 50% -8%,rgba(43,211,172,.2),transparent 62%),var(--bg);padding:calc(28px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px))}
#lg[hidden]{display:none}
.lgc{max-width:400px;margin:0 auto}
.lgc .logo{font-size:34px;margin-top:28px}
.lgt{text-align:center;color:var(--mut);margin-top:6px}
.gbtn{width:100%;min-height:50px;border-radius:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:28px}
.or{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:12px;margin:20px 0 4px;text-transform:uppercase;letter-spacing:.14em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.lgerr{color:var(--warn);font-size:14px;margin-top:10px;min-height:20px;text-align:center}
.lgn{color:var(--mut);font-size:12.5px;text-align:center;margin-top:18px}
.ico{width:32px;height:32px;border-radius:8px;background:transparent;border:0;color:var(--mut);display:flex;align-items:center;justify-content:center;font-size:16px;padding:0}
.ico:active{background:var(--chip)}
/* ===== v4: dark buttons, bottom composer, chat, profile ===== */
:root{--btn-bg:#0A0E0D;--btn-bd:#2A3532;--btn-tx:#F0F0F0}
.b,.b.g,.ad,.ad.on,.mb,.ch button,.ch button.on,.mcomp .mb,.gbtn{background:var(--btn-bg);color:var(--btn-tx);border:1px solid var(--btn-bd);box-shadow:none;background-image:none}
.ch button{color:#B9C4C1}
.ch button.on{color:var(--btn-tx);border-color:var(--btn-tx)}
.ad.on{border-color:var(--btn-tx)}
.b:active,.ad:active{filter:brightness(1.5)}
.b.r,.b.g.r{background:#2A1210;color:#FF9C8F;border-color:#5A2320}
.gbtn{border-radius:14px}
.flag-banner button{background:#2A1210;color:#FF9C8F;border:1px solid #5A2320}
.icob{width:38px;height:38px;min-width:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:17px;padding:0;background:var(--btn-bg);color:var(--btn-tx);border:1px solid var(--btn-bd);flex-shrink:0;cursor:pointer;transition:transform .12s,filter .15s}
.icob:active{transform:scale(.92);filter:brightness(1.5)}
.icob.xs{width:30px;height:30px;min-width:30px;font-size:14px}
.icob.rec{background:#2A1210;color:#FF9C8F;border-color:#5A2320}
.pb{min-height:40px;height:40px;padding:0 16px;font-size:14px;font-weight:600;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.chat-wrap{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.chead{position:sticky;top:calc(60px + env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 10px;margin-top:8px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 28px -12px rgba(0,0,0,.6)}
.msc{display:flex;flex-direction:column;padding:10px 0 4px}
.mrow{display:flex;align-items:flex-end;gap:6px;margin-top:6px}
.mrow.me{justify-content:flex-end}
.mrow .av{width:28px;height:28px;font-size:12px;box-shadow:none}
.avsp{width:28px;flex-shrink:0}
.btime{font-size:10.5px;color:var(--mut);margin-top:3px;padding:0 4px}
.mrow.me .btime{text-align:right}
.bact{display:flex;gap:6px;margin-top:4px}
.mrow.me .bact{justify-content:flex-end}
.bub img.ph,.bub video{max-width:220px;border-radius:12px;margin-top:6px;display:block}
.fchip{display:inline-flex;gap:6px;align-items:center;margin-top:6px;padding:6px 10px;background:var(--chip);border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--ink);text-decoration:none}
.mcomp{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:7;max-width:560px;margin:0 auto;display:flex;flex-wrap:nowrap;align-items:center;gap:6px;padding:8px 10px;background:var(--card);border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none}
.mcomp input{flex:1;min-width:0;margin:0;border-radius:999px}
.mcomp .send{margin-left:0}
.att{position:absolute;top:-16px;left:14px;font-size:11px;color:var(--mut);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:2px 8px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmenu{position:fixed;inset:0;z-index:9}
.cmenu .panel{position:absolute;top:calc(120px + env(safe-area-inset-top,0px));right:12px;min-width:160px;background:var(--btn-bg);border:1px solid var(--btn-bd);border-radius:12px;padding:4px;box-shadow:0 10px 26px rgba(0,0,0,.5)}
.cmenu .panel button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#FF9C8F;font-weight:600;font-size:14px;min-height:42px;padding:0 14px;border-radius:8px}
.prof-actions{display:flex;justify-content:center;gap:10px;margin-top:12px}
.prof-actions .pb{min-width:130px;flex:1;max-width:200px}
.conv{display:flex;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.conv:last-child{border-bottom:0}
.conv .pv{font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="w">
<header>
  <button id="mb" class="mb" aria-label="Menu"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h16"/></svg></button>
  <div class="logo">Vimline</div>
  <button id="searchBtn" class="mb" aria-label="Search"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
</header>
<nav class="tabs" aria-label="Main">
<button id="t0" class="on" aria-label="Feed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 10.4 12 3l8.8 7.4"/><path d="M5.6 9v10.2c0 .9.7 1.6 1.6 1.6h9.6c.9 0 1.6-.7 1.6-1.6V9"/><path d="M9.7 20.8v-5.2c0-.7.5-1.2 1.2-1.2h2.2c.7 0 1.2.5 1.2 1.2v5.2"/></svg></button>
<button id="t1" aria-label="Services"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.8" y="7.2" width="18.4" height="13" rx="2.6"/><path d="M8.6 7.2V5.6c0-1 .8-1.8 1.8-1.8h3.2c1 0 1.8.8 1.8 1.8v1.6"/><path d="M2.8 12.6h18.4"/><path d="M10.5 12.6v2h3v-2"/></svg></button>
<button id="t2" aria-label="Inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.9 11.6a8.5 8.5 0 0 1-12.3 7.6l-5.3 1.5 1.5-5.1a8.5 8.5 0 1 1 16.1-4z"/><circle cx="8.4" cy="11.6" r="1" fill="currentColor" stroke="none"/><circle cx="12.1" cy="11.6" r="1" fill="currentColor" stroke="none"/><circle cx="15.8" cy="11.6" r="1" fill="currentColor" stroke="none"/></svg><span class="bdg" id="b2" hidden></span></button>
<button id="t3" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 8.7a5.9 5.9 0 0 0-11.8 0c0 6.4-2.3 7.7-2.3 7.7h16.4s-2.3-1.3-2.3-7.7"/><path d="M10.2 20.2a2 2 0 0 0 3.6 0"/></svg><span class="bdg" id="b3" hidden></span></button>
<button id="t4" class="avatar-tab" aria-label="Profile"></button>
</nav>
<div id="msg" hidden></div>
<div id="view"></div>
</div>
<div id="lg" hidden>
  <div class="lgc">

function editPhone(){
  const v=prompt(bn?"ফোন নাম্বার লিখুন":"Enter phone number",pf(me).phone||"");
  if(v===null)return;
  db.collection("profiles").doc(me).set({phone:v.trim()},{merge:true}).then(()=>{if(P[me])P[me].phone=v.trim();toast(t("Saved"));render()}).catch(()=>toast(bn?"সেভ হয়নি":"Could not save"));
}
function editEmail(){
  const cu=firebase.auth().currentUser;if(!cu){toast(bn?"আবার লগইন করুন":"Please log in again");return}
  const v=prompt(bn?"নতুন জিমেইল লিখুন":"Enter new Gmail",pf(me).email||cu.email||"");
  if(!v)return;const em=v.trim();
  const save=()=>db.collection("profiles").doc(me).set({email:em},{merge:true}).then(()=>{if(P[me])P[me].email=em;toast(bn?"জিমেইল আপডেট হয়েছে":"Gmail updated");render()});
  if(cu.email)cu.verifyBeforeUpdateEmail(em).then(()=>{save();toast(bn?"নতুন জিমেইলে আসা মেইল কনফার্ম করুন":"Confirm the mail sent to your new Gmail")}).catch(()=>save());
  else save();
}
function editPass(){
  const cu=firebase.auth().currentUser;if(!cu){toast(bn?"আবার লগইন করুন":"Please log in again");return}
  const cp=prompt(bn?"বর্তমান পাসওয়ার্ড":"Current password","");if(cp===null)return;
  const np=prompt(bn?"নতুন পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)":"New password (min 6 chars)","");if(!np)return;
  if(np.length<6){toast(bn?"কমপক্ষে ৬ অক্ষর":"At least 6 characters");return}
  const upd=()=>cu.updatePassword(np).then(()=>toast(bn?"পাসওয়ার্ড বদলে গেছে":"Password changed")).catch(()=>toast(bn?"পারা গেল না — আবার লগইন করে চেষ্টা করুন":"Could not change — log in again and retry"));
  if(cu.email){const c=firebase.auth.EmailAuthProvider.credential(cu.email,cp);cu.reauthenticateWithCredential(c).then(upd).catch(()=>toast(bn?"বর্তমান পাসওয়ার্ড ভুল":"Current password is wrong"))}
  else upd();
}

      if(!/^[a-z0-9_]{3,20}$/.test(un)){toast(bn?"ইউজারনেম: ৩-২০ অক্ষর (a-z, 0-9, _)":"Username: 3-20 chars (a-z,0-9,_)");return}
      if(un!==(pf(me).usernameLower||"")){const ex=await db.collection("profiles").where("usernameLower","==",un).limit(1).get();if(!ex.empty){toast(bn?"ইউজারনেমটি নেওয়া হয়েছে":"Username taken");return}}
      const doc={name,username:un,usernameLower:un,area,ts:pf(me).ts||Date.now()};

/* ===== Auth & listeners ===== */
function start(){
  if(unsubs.length)return;
  for(const k in mcache)delete mcache[k];
  Object.assign(D,{posts:[],likes:[],cms:[],pr:[],cr:[],svc:[],follows:[],blocks:[],groups:[],gm:[],notifs:[],msgs:[]});
  const push=u=>unsubs.push(u);
  push(db.collection("profiles").onSnapshot(s=>{s.forEach(d=>P[d.id]=d.data());render()}));
  push(db.collection("posts").orderBy("ts","desc").limit(150).onSnapshot(s=>{D.posts=s.docs.map(d=>({id:d.id,...d.data()}));render()}));
  push(db.collection("likes").onSnapshot(s=>{D.likes=s.docs.map(d=>({id:d.id,...d.data()}));render()}));
  push(db.collection("comments").onSnapshot(s=>{D.cms=s.docs.map(d=>({id:d.id,...d.data()}));render()}));
  push(db.collection("pReacts").onSnapshot(s=>{D.pr=s.docs.map(d=>({id:d.id,...d.data()}));render()}));
  push(db.collection("cReacts").onSnapshot(s=>{D.cr=s.docs.map(d=>({id:d.id,...d.data()}));render()}));
  push(db.collection("svc").onSnapshot(s=>{D.svc=s.docs.map(d=>({id:d.id,...d.data()}));render()}));
  push(db.collection("follows").onSnapshot(s=>{D.follows=s.docs.map(d=>({id:d.id,...d.data()}));render()}));
  push(db.collection("blocks").onSnapshot(s=>{D.blocks=s.docs.map(d=>({id:d.id,...d.data()}));render()}));
  push(db.collection("groups").where("members","array-contains",me).onSnapshot(s=>{D.groups=s.docs.map(d=>({id:d.id,...d.data()}));render()}));
  push(db.collection("gmsgs").orderBy("ts","desc").limit(300).onSnapshot(s=>{D.gm=s.docs.map(d=>({id:d.id,...d.data()}));render()}));
  push(db.collection("notifs").where("to","==",me).onSnapshot(s=>{D.notifs=s.docs.map(d=>({id:d.id,...d.data()}));render()}));
  const mh=s=>{s.docChanges().forEach(c=>{if(c.type==="removed")delete mcache[c.doc.id];else mcache[c.doc.id]={id:c.doc.id,...c.doc.data()}});D.msgs=Object.values(mcache);render()};
  push(db.collection("msgs").where("from","==",me).onSnapshot(mh));
  push(db.collection("msgs").where("to","==",me).onSnapshot(mh));
}
function stopAll(){unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];for(const k in mcache)delete mcache[k];Object.assign(D,{posts:[],likes:[],cms:[],pr:[],cr:[],svc:[],follows:[],blocks:[],groups:[],gm:[],notifs:[],msgs:[]});mOpen=null;sheet=null;addOpen=false;svcOpen=false;setupOpen=false;searchOpen=false;pendPost=null;pendAtt=null;pendVoice=null}

  $("#lgt").textContent=bn?"প্রতিবেশীর ফিড, সার্ভিস ও চ্যাট":"Neighborhood feed, services & chat";
  $("#gtx").textContent=bn?"গুগল দিয়ে চালিয়ে যান":"Continue with Google";
